name: identity-gate

on: [push, pull_request]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build engine + tests
        run: |
          g++ -std=c++20 -O2 -Wall -Iengine/include -o jerrymap engine/cli/main.cpp engine/src/*.cpp
          g++ -std=c++20 -O2 -Wall -Iengine/include -o engine_tests engine/tests/test_engine.cpp engine/src/*.cpp
      - name: RNG vectors + unit tests
        run: ./engine_tests
      - name: Proofs (scripted decider, save-resume, dial suites)
        run: python scripts/run_proofs.py --native ./jerrymap
      - name: Identity gate, Python vs native
        run: python scripts/run_gate.py --native ./jerrymap
      - name: Book conformance (both implementations)
        run: python scripts/run_conformance.py --native ./jerrymap
      - name: Render-layer checks (engine map vs the twin's own render)
        run: python scripts/run_render_checks.py --native ./jerrymap

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Pinned on purpose: an unpinned emsdk moved mid-deploy once and broke
      # the wasm link. The version lives in engine/wasm/toolchain.json, which
      # build.sh also checks, so CI and a fresh clone build the same engine.
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: "6.0.5" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build native (comparison baseline)
        run: g++ -std=c++20 -O2 -Wall -Iengine/include -o jerrymap engine/cli/main.cpp engine/src/*.cpp
      - name: Build WASM
        run: bash engine/wasm/build.sh
      - name: Identity gate, Python vs native vs WASM
        run: python scripts/run_gate.py --native ./jerrymap --wasm engine/wasm/dist/jerrymap.js

  app:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/pwa }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # No Emscripten here on purpose: the app consumes the COMMITTED engine
      # (engine/wasm/prebuilt), exactly what every static host serves. The
      # smoke suite asserts that artifact matches the sources (version,
      # lineage, golden bytes), so a stale commit fails right here.
      - name: Install app dependencies
        run: npm ci
      - name: Unit tests + browser-build smoke (base-42 vs the oracle log)
        run: npm test
      - name: Build (typecheck + bundle + name-derived manifest)
        run: npm run build
      - name: Name-constant + manifest checks over the build
        run: npx vitest run tests/name-constant.test.ts
      - name: Playwright e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
